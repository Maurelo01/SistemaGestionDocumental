@if (forzar || cargaService.cargando())
{
  <div [ngClass]="modoOverlay ? 'spinner-overlay' : 'd-flex justify-content-center py-4'" role="status" aria-label="loading">
    <svg class="p-progress-spinner-svg" viewBox="25 25 50 50">
      <circle
        class="p-progress-spinner-track"
        cx="50"
        cy="50"
        r="20"
        fill="none"
        stroke-width="4"
      />
      <circle
        class="p-progress-spinner-circle"
        cx="50"
        cy="50"
        r="20"
        fill="none"
        stroke-width="4"
        stroke-miterlimit="10"
      />
    </svg>
  </div>
}
